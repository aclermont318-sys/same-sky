<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBF3EB">
  <title>Same Sky 💌</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Same Sky">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="wordmark"><span class="wordmark-title">Same Sky</span><span class="wordmark-sub">two hearts · one sky</span></h1>
      <nav class="navpills" aria-label="Main">
        <button data-nav="home" class="active">Home</button>
        <button data-nav="map">Map</button>
        <button data-nav="memories">Memories</button>
        <button data-nav="notes">Notes</button>
        <button data-nav="us">Us</button>
      </nav>
      <button class="gear" data-nav="settings" aria-label="Settings" title="Settings">⚙️</button>
    </div>
    <div class="airmail-strip" aria-hidden="true"></div>
  </header>

  <main id="main">
    <section class="view active" id="view-home" aria-label="Home"></section>
    <section class="view" id="view-map" aria-label="Map"></section>
    <section class="view" id="view-memories" aria-label="Memories"></section>
    <section class="view" id="view-notes" aria-label="Notes"></section>
    <section class="view" id="view-us" aria-label="Us"></section>
    <section class="view" id="view-settings" aria-label="Settings"></section>
  </main>

  <nav class="tabbar" aria-label="Main mobile">
    <button data-nav="home" class="active"><span>🏡</span>Home</button>
    <button data-nav="map"><span>🗺️</span>Map</button>
    <button data-nav="memories"><span>📸</span>Memories</button>
    <button data-nav="notes"><span>💌</span>Notes</button>
    <button data-nav="us"><span>💞</span>Us</button>
  </nav>

  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=2"></script>
  <script>
    // updateViaCache:'none' means the worker itself is never served stale.
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
